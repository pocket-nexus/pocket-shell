name: 3DS release build

on:
  pull_request:
    paths:
      - '.github/workflows/*3ds.yml'
      - '.bun-version'
      - 'scripts/**'
      - 'shells/3ds/**'
      - 'vendor/pocketjs'
      - 'package.json'
      - 'bun.lock'
  workflow_call:
    inputs:
      ref:
        description: The commit to build; its committed versions name the release
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build the 3DSX
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun run setup
      - name: Test the release scripts and artifact checks
        run: bun test ./scripts
      - name: Install the runtime's pinned Rust toolchain
        run: |
          nightly="$(bun -e 'import { BUILD_STD_NIGHTLY } from "./vendor/pocketjs/tools/build/toolchains/rust.ts"; console.log(BUILD_STD_NIGHTLY)')"
          rustup toolchain install "$nightly" --profile minimal --component rust-src
      - name: Pull the runtime's pinned devkitARM image
        run: |
          image=$(bun -e 'import { THREE_DS_CONTAINER_IMAGE } from "./vendor/pocketjs/tools/3ds-toolchain.ts"; console.log(THREE_DS_CONTAINER_IMAGE)')
          docker pull "$image"
      - name: Build the release binary
        run: bun run 3ds
      - name: Verify and stage release files
        run: |
          bun scripts/release-3ds.ts stage
          cd dist/release
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: 3ds-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
