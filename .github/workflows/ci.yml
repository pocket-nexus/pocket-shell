name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: The 3DS and touch shells, runtime, link and CLI on macOS
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Read the runtime's pinned Rust toolchain
        id: rust-pin
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' vendor/pocketjs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          targets: wasm32-unknown-unknown
      - run: bun run setup
      - run: bun run check

  devices:
    name: Device programs' host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # 3ds-composition.test.ts builds devices/3ds/core with the stable
      # compiler PocketJS pins.
      - name: Read the runtime's pinned Rust toolchain
        id: rust-pin
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' vendor/pocketjs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      # camera-photo.test.ts links the computer's libjpeg.
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libjpeg-turbo8-dev pkg-config
      - run: bun run setup
      - run: bun run check:devices

  linux:
    name: The 3DS and touch shells, runtime, link and CLI on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Read the runtime's pinned Rust toolchain
        id: rust-pin
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' vendor/pocketjs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/pocketjs
      - run: bun run setup
      - run: bun run check
