name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: All shells and WASM on macOS
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Read the runtime's pinned Rust toolchain
        id: rust-pin
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' vendor/pocketjs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          targets: wasm32-unknown-unknown
      - run: bun run setup
      - run: bun run check
      - run: bun run desktop test:rust

  linux-web:
    name: Browser preview and site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Read the runtime's pinned Rust toolchain
        id: rust-pin
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' vendor/pocketjs/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/pocketjs
      - run: bun run setup
      - run: bun run check
      - run: bun run desktop test:rust
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
      - name: Exercise the interactive WASM System preview
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bun run desktop test:web
      - name: Build and verify the product site
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bun run --cwd shells/desktop build:site --reuse-preview && bun run desktop test:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-shell-desktop-web
          path: |
            shells/desktop/dist/web
            shells/desktop/dist/web-smoke.png
            shells/desktop/dist/site-smoke.png
            shells/desktop/dist/site
          if-no-files-found: error
