name: Release 3DS
run-name: Release 3DS from ${{ github.ref_name }}

# Publishing is only triggered by the Actions "Run workflow" button or gh.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-3ds
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Reserve the release date
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A rerun keeps the original dispatch date, even across midnight.
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          version=$(bun scripts/release-3ds.ts version "$created")
          tag="v$version"
          tags=$(git ls-remote --tags origin "refs/tags/$tag")
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if [ -n "$tags" ] || echo "$releases" | grep -Fxq "$tag"; then
            echo "::error::Release or tag $tag already exists; published assets are never overwritten."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build-3ds.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: 3ds-release
          path: dist/release
      - name: Publish the verified build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd dist/release
          sha256sum --check SHA256SUMS
          test "$(jq -r .source build-info.json)" = "$GITHUB_SHA"
          test "$(jq -r .version build-info.json)" = "$RELEASE_VERSION"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Nintendo 3DS build. Release dates use Asia/Shanghai.

          - `.3dsx`: copy to the SD card's `/3ds/` directory and launch with Homebrew Launcher.
          - `.cia`: install with your homebrew CIA installer.
          - `SHA256SUMS`: checksums for both binaries.
          - `build-info.json`: source and PocketJS commits, application version and workflow run.

          CI verifies compilation, package headers and checksums. It does not verify a physical console boot or interaction.
          EOF
          printf '\nSource: %s\nBuild: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
          tag="v$RELEASE_VERSION"
          gh release create "$tag" ./*.3dsx ./*.cia SHA256SUMS build-info.json \
            --target "$GITHUB_SHA" --title "Pocket Shell $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          gh release edit "$tag" --draft=false --latest
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
